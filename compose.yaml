# OpenGate only — no database, no Ollama. Used as-is by Coolify and locally:
#   docker compose up --build -d     (with OPENGATE_PUBLISH_ADDRESS=127.0.0.1 in .env)
services:
  opengate:
    build: .
    restart: unless-stopped
    environment:
      OPENGATE_API_KEY: ${OPENGATE_API_KEY:?OPENGATE_API_KEY is required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL is required}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      # Context window requested from Ollama per request (README: "Context
      # window"). Empty = Ollama's own setting. Must fit the PC's memory.
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-}
      OPENGATE_VIRTUAL_MODEL: ${OPENGATE_VIRTUAL_MODEL:-opengate/local}
      OPENGATE_HOST: 0.0.0.0
      OPENGATE_PORT: "8000"
      UPSTREAM_CONNECT_TIMEOUT_SECONDS: ${UPSTREAM_CONNECT_TIMEOUT_SECONDS:-3}
      UPSTREAM_REQUEST_TIMEOUT_SECONDS: ${UPSTREAM_REQUEST_TIMEOUT_SECONDS:-120}
      UPSTREAM_STREAM_IDLE_TIMEOUT_SECONDS: ${UPSTREAM_STREAM_IDLE_TIMEOUT_SECONDS:-60}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-2}
      RUST_LOG: ${RUST_LOG:-info}
      LOG_PROMPT_CONTENT: ${LOG_PROMPT_CONTENT:-false}
      # Wake-on-LAN (README: "Wake-on-LAN"). Off unless WOL_ENABLED=true.
      # On this bridge network a broadcast cannot reach the LAN, so set
      # WOL_RELAY_ADDRESS and run compose.wol-relay.yaml on the same host.
      WOL_ENABLED: ${WOL_ENABLED:-false}
      WOL_MAC_ADDRESS: ${WOL_MAC_ADDRESS:-}
      WOL_BROADCAST_ADDRESS: ${WOL_BROADCAST_ADDRESS:-}
      WOL_PORT: ${WOL_PORT:-9}
      WOL_RELAY_ADDRESS: ${WOL_RELAY_ADDRESS:-}
      WOL_STARTUP_TIMEOUT_SECONDS: ${WOL_STARTUP_TIMEOUT_SECONDS:-90}
      WOL_POLL_INTERVAL_SECONDS: ${WOL_POLL_INTERVAL_SECONDS:-3}
      WOL_RETRY_COOLDOWN_SECONDS: ${WOL_RETRY_COOLDOWN_SECONDS:-30}
      # ChatGPT plan fallback (README: "ChatGPT plan fallback"). Off unless
      # CHATGPT_FALLBACK_ENABLED=true; then CHATGPT_CREDENTIALS_KEY is required.
      # Sign in once with `opengate chatgpt login` inside this container.
      CHATGPT_FALLBACK_ENABLED: ${CHATGPT_FALLBACK_ENABLED:-false}
      CHATGPT_AUTH_METHOD: ${CHATGPT_AUTH_METHOD:-official_oauth}
      CHATGPT_PROVIDER: ${CHATGPT_PROVIDER:-responses}
      CHATGPT_MODEL: ${CHATGPT_MODEL:-auto}
      CHATGPT_CREDENTIALS_KEY: ${CHATGPT_CREDENTIALS_KEY:-}
      CHATGPT_CREDENTIALS_PATH: /data/chatgpt/credentials.json
      CHATGPT_REQUEST_TIMEOUT_SECONDS: ${CHATGPT_REQUEST_TIMEOUT_SECONDS:-300}
      CHATGPT_STREAM_IDLE_TIMEOUT_SECONDS: ${CHATGPT_STREAM_IDLE_TIMEOUT_SECONDS:-120}
      CHATGPT_LIMIT_PAUSE_SECONDS: ${CHATGPT_LIMIT_PAUSE_SECONDS:-300}
      CHATGPT_DROP_UNSUPPORTED_SAMPLING: ${CHATGPT_DROP_UNSUPPORTED_SAMPLING:-false}
      CHATGPT_DROP_MAX_TOKENS: ${CHATGPT_DROP_MAX_TOKENS:-false}
      # Must stay false: OpenGate refuses to start otherwise. It never uses
      # an OpenAI API key or API billing.
      OPENAI_API_BILLING_ENABLED: "false"
    volumes:
      # Encrypted credentials + host ID; survives restarts and redeploys.
      - opengate-data:/data
    # Lets WOL_RELAY_ADDRESS=host.docker.internal:9009 reach the host-side relay.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Where the host publishes OpenGate. Required, so a deployment without it
    # fails visibly instead of silently binding somewhere unreachable: the
    # Coolify server's LAN IP in Coolify, 127.0.0.1 for local testing. Never
    # host port 8000 on the Coolify server: Coolify's dashboard listens there.
    # The container itself always listens on 8000.
    ports:
      - "${OPENGATE_PUBLISH_ADDRESS:?OPENGATE_PUBLISH_ADDRESS is required (LAN IP on Coolify, 127.0.0.1 locally)}:${OPENGATE_PUBLISH_PORT:-8100}:8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "opengate", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  opengate-data:
